name: Generate RS Log

# Our own copy of Fred6725/relative-strength's daily job (see rs/README.md).
# When it finishes, build.yml picks up the new CSVs via workflow_run.

on:
  # The main run is started by cron-job.org at 6:37pm Eastern (3:37pm
  # Pacific) Mon-Fri through "Run workflow" (workflow_dispatch), which GitHub
  # never delays and which always does a full run.
  # The schedule below is only a backup in case that run fails or never
  # starts. It is set after the main run so it can never publish early data,
  # and it exits in seconds if the RS log was published in the last 12 hours.
  #   01:17 UTC Tue-Sat = 5:17pm PST / 6:17pm PDT (previous day Pacific)
  # GitHub often starts scheduled runs hours late; the 12-hour check covers that.
  schedule:
    - cron: '17 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

# Shared with the weekly ticker_info refresh so they never commit at once
concurrency:
  group: rs-log
  cancel-in-progress: false

jobs:
  generate-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # Backup runs stop here if a run already published recently
      - name: Skip if already published in the last 12 hours
        id: guard
        run: |
          LAST=$(git log -1 --format=%ct -- output/rs_stocks.csv || echo 0)
          AGE=$(( $(date +%s) - ${LAST:-0} ))
          echo "Last RS publish was $((AGE / 60)) minutes ago"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$AGE" -lt 43200 ]; then
            echo "Already published recently - skipping this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rs/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Same as `python relative-strength.py true` (download prices, then rank),
      # split into two steps so fix_splits.py can run in between: on a split day
      # Yahoo can serve unadjusted older prices for a few hours, which makes a
      # reverse split look like a huge gain (SLXN/GOVX on 2026-11-11).
      - name: Download price history
        if: steps.guard.outputs.skip != 'true'
        run: python -c "import rs_data; rs_data.main(False)"

      - name: Repair splits Yahoo hasn't applied yet
        if: steps.guard.outputs.skip != 'true'
        run: python fix_splits.py

      - name: Run relative strength calculation
        if: steps.guard.outputs.skip != 'true'
        run: python -c "import rs_ranking; rs_ranking.main(True)"

      # Refuse to publish a broken run (e.g. Yahoo blocked most downloads):
      # the dashboard keeps the previous day's data instead.
      - name: Sanity-check output
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ROWS=$(($(wc -l < output/rs_stocks.csv) - 1))
          IND=$(($(wc -l < output/rs_industries.csv) - 1))
          echo "rs_stocks.csv: $ROWS stocks | rs_industries.csv: $IND industries"
          if [ "$ROWS" -lt 4000 ] || [ "$IND" -lt 100 ]; then
            echo "::error::Too few rows - not publishing this run"
            exit 1
          fi

      - name: Commit and push RS log
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data_persist/ticker_info.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "RS Ratings update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
